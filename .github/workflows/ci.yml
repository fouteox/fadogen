name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_ENV: testing
  CACHE_STORE: array
  DB_CONNECTION: sqlite
  DB_DATABASE: database/database.sqlite
  MAIL_MAILER: array
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: array

jobs:
  base-image-policy:
    name: Validate ServerSideUp base image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Verify pinned ServerSideUp provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/verify-serversideup-base.sh

      - name: Install checksum-verified Trivy
        env:
          TRIVY_VERSION: 0.72.0
        run: |
          case "$RUNNER_ARCH" in
            X64)
              archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
              checksum=bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
              ;;
            ARM64)
              archive="trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"
              checksum=2ca2c023109c2db6b2b77366b6717291452d4531167377d95c79547f0c8e3467
              ;;
            *)
              echo "Unsupported runner architecture: $RUNNER_ARCH" >&2
              exit 1
              ;;
          esac

          archive_path="$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}" \
            --output "$archive_path"
          printf '%s  %s\n' "$checksum" "$archive_path" | sha256sum --check -
          tar -xzf "$archive_path" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/trivy" --version

      - name: Reject newly introduced fixable HIGH/CRITICAL vulnerabilities
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: .github/scripts/compare-base-vulnerabilities.sh

  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject production env secrets in workflows
        run: |
          forbidden='ENV_FILE_'
          if git grep -n "${forbidden}BASE64" -- .github/workflows; then
            echo '::error::Production runtime environments must never be CI build inputs.'
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, sqlite3, bcmath, intl
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: '24'
          cache: false
          run-install: false

      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force --ansi
          php artisan migrate --force --no-interaction

      - name: Install frontend dependencies
        run: vp install --frozen-lockfile

      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --no-interaction

      - name: Check PHP formatting
        run: composer test:lint

      - name: Run static analysis
        run: composer test:types

      - name: Run PHP tests with the project coverage gate
        run: composer test:unit

      - name: Check frontend formatting
        run: vp run format:check

      - name: Run frontend lint
        run: vp run lint:check

      - name: Check TypeScript
        run: vp run types

      - name: Build production assets and SSR bundle
        run: vp run build:ssr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build production App image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: app
          load: true
          tags: fadogen-app-smoke:${{ github.sha }}
          provenance: false
          sbom: false

      - name: Build production SSR image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ssr
          load: true
          tags: fadogen-ssr-smoke:${{ github.sha }}
          provenance: false
          sbom: false

      - name: Smoke-test production images
        run: |
          app_image="fadogen-app-smoke:${GITHUB_SHA}"
          ssr_image="fadogen-ssr-smoke:${GITHUB_SHA}"

          docker run --rm \
            --env APP_ENV=production \
            --env APP_DEBUG=false \
            --env APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --env CACHE_STORE=array \
            --env DB_CONNECTION=sqlite \
            --env DB_DATABASE=/var/www/html/database/database.sqlite \
            --env QUEUE_CONNECTION=sync \
            --env SESSION_DRIVER=array \
            --entrypoint sh \
            "$app_image" \
            -euc '
              test -s public/build/manifest.json
              php artisan about --only=environment
              php -r '\''
                  foreach (["bcmath", "intl", "pdo_sqlite"] as $extension) {
                      if (! extension_loaded($extension)) {
                          fwrite(STDERR, "Missing PHP extension: {$extension}\n");
                          exit(1);
                      }
                  }
              '\''
            '

          docker run --rm --entrypoint sh "$ssr_image" -euc '
            bun --version
            find bootstrap/ssr -maxdepth 1 -type f -name "*.js" -print -quit | grep -q .
          '

  zizmor:
    name: zizmor (audit workflows)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 1.26.1 = dernière version saine du manifeste embarqué par l'action
      # v0.6.0 (jamais 1.27.0 : fuite de credentials, GHSA-f42p-wjw5-97qh) ;
      # repasser à >= 1.28.0 à la prochaine release de zizmor-action.
      # Bloquant via annotations + exit codes ; le mode SARIF
      # (advanced-security) ne fait jamais échouer le job.
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          version: 1.26.1
          persona: regular
          advanced-security: false
          annotations: true
