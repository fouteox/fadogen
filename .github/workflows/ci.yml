name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_ENV: testing
  CACHE_STORE: array
  DB_CONNECTION: sqlite
  DB_DATABASE: database/database.sqlite
  MAIL_MAILER: array
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: array

jobs:
  base-image-policy:
    name: Validate ServerSideUp base image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Test Bun image policy scripts
        run: .github/scripts/tests/test-bun-policy.sh

      - name: Verify pinned ServerSideUp provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/verify-serversideup-base.sh

      - name: Verify pinned Bun provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/verify-bun-base.sh

      - name: Verify pinned Trivy runtime
        run: |
          # renovate: datasource=docker depName=ghcr.io/aquasecurity/trivy
          image_ref="ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969"
          docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            "$image_ref" --version
          echo "TRIVY_IMAGE_REF=$image_ref" >> "$GITHUB_ENV"

      - name: Reject newly introduced fixable HIGH/CRITICAL vulnerabilities
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          TRIVY_IMAGE_REF: ${{ env.TRIVY_IMAGE_REF }}
        run: .github/scripts/compare-base-vulnerabilities.sh

      - name: Reject fixable HIGH/CRITICAL vulnerabilities in the Bun base
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          TRIVY_IMAGE_REF: ${{ env.TRIVY_IMAGE_REF }}
        run: .github/scripts/scan-bun-base-vulnerabilities.sh

  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject production env secrets in workflows
        run: |
          forbidden='ENV_FILE_'
          if git grep -n "${forbidden}BASE64" -- .github/workflows; then
            echo '::error::Production runtime environments must never be CI build inputs.'
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, sqlite3, bcmath, intl
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          ignore-cache: '1'

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: '24'
          cache: false
          run-install: false

      - name: Prepare application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force --ansi
          php artisan migrate --force --no-interaction

      - name: Install frontend dependencies
        run: vp install --frozen-lockfile

      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --no-interaction

      - name: Check PHP formatting
        run: composer test:lint

      - name: Run static analysis
        run: composer test:types

      - name: Run PHP tests with the project coverage gate
        run: composer test:unit

      - name: Check frontend formatting
        run: vp run format:check

      - name: Run frontend lint
        run: vp run lint:check

      - name: Check TypeScript
        run: vp run types

      - name: Build production assets and SSR bundle
        run: |
          umask 077
          vp run build:ssr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: app
          load: true
          tags: fadogen-smoke:${{ github.sha }}
          provenance: false
          sbom: false

      - name: Test web and SSR from the same production image
        env:
          IMAGE_REF: fadogen-smoke:${{ github.sha }}
        run: .github/scripts/tests/test-production-image.sh "$IMAGE_REF"

  zizmor:
    name: zizmor (audit workflows)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Renovate met à jour atomiquement le SHA de l'action et l'input version.
      # Le manifeste embarqué résout cette version vers une image tag@digest ;
      # la politique du runner interdit Zizmor 1.27.0 (GHSA-f42p-wjw5-97qh).
      # Bloquant via annotations + exit codes ; le mode SARIF
      # (advanced-security) ne fait jamais échouer le job.
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: 1.29.0
          persona: regular
          advanced-security: false
          annotations: true
